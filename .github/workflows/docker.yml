name: Docker Build & E2E

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          load: true
          tags: monopeli-backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/nginx/Dockerfile.prod
          load: true
          tags: monopeli-nginx:test
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Create .env file
        run: cp .env.example .env

      - name: Start compose stack
        run: |
          # Override image names to use locally built images
          BACKEND_IMAGE=monopeli-backend:test \
          NGINX_IMAGE=monopeli-nginx:test \
          docker compose -f docker-compose.prod.yml up -d

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          docker compose -f docker-compose.prod.yml logs
          exit 1

      - name: Verify API
        run: |
          curl -sf http://localhost:8080/health | python3 -m json.tool

      - name: Verify frontend
        run: |
          curl -sf http://localhost:8080/ | head -20

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests against Docker
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: npx playwright test --project=chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Stop compose stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down
