[project]
name = "monopoly-engine"
version = "0.1.0"
description = "Pure Python Monopoly game engine with web backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29.0",
    "pettingzoo>=1.24.0",
    "numpy>=1.24.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
    "tqdm>=4.67.2",
    "rich>=14.3.2",
    "prometheus-client>=0.20.0",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.82.0",
    "mypy>=1.4.0",
    "ruff>=0.0.280",
    "black>=23.7.0",
    "httpx>=0.26.0",
    "pytest-asyncio>=0.23.0",
]
training = [
    "stable-baselines3>=2.0.0",
    "sb3-contrib>=2.0.0",
    "tensorboard>=2.14.0",
    "torch>=2.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monopoly_engine", "monopoly_gym", "api"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["union-attr", "index", "attr-defined", "unused-ignore", "arg-type", "operator"]

[[tool.mypy.overrides]]
module = "training.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["stable_baselines3.*", "sb3_contrib.*", "torch.*", "tensorboard.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=monopoly_engine --cov=monopoly_gym --cov=api --cov-report=html --cov-report=term-missing"

[dependency-groups]
dev = [
    "black>=26.1.0",
    "hypothesis>=6.151.4",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
]
